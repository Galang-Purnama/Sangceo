name: Penjaga PR

# Satu-satunya jalur yang mengomentari, menutup, dan meng-merge PR.
#
# Workflow yang dipicu pull_request dari fork selalu menerima token baca-saja,
# sekalipun `permissions:` menulis `write` dan setelan repo juga `write`. Log run
# membuktikannya: "Contents: read / Issues: read / PullRequests: read". Akibatnya
# setiap PR dari kontributor baru menggantung tanpa komentar dan tanpa merge.
#
# Pemicu di sini sengaja bukan pull_request, melainkan jadwal dan workflow_dispatch.
# Keduanya berjalan di repo ini dengan izin penuh, dan tidak ada kode atau skrip dari
# fork yang ikut dijalankan. Run yang dipicu jadwal juga tidak pernah berstatus
# "action_required", jadi tidak ada lagi tombol approve yang harus ditekan pemilik
# repo. PR baru ditangani paling lama tiga menit setelah dibuka.
on:
  schedule:
    - cron: "*/3 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: penjaga-pr
  cancel-in-progress: false

jobs:
  jaga:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Periksa dan bereskan PR terbuka
        env:
          # Token bawaan GitHub, bukan secret. gh membacanya dari GH_TOKEN.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/jaga-pr.sh
