name: Merge pull request

# Dipicu langsung oleh PR, bukan oleh selesainya workflow lain.
#
# Jalur lama memakai workflow_run, dan pemicu itu bisa tidak berjalan untuk
# kontributor yang baru pertama kali membuka PR. PR-nya lolos validasi, tetapi
# tidak pernah di-merge dan tidak ada yang memberi tahu pemiliknya. Pemicu
# pull_request selalu berjalan, jadi hasilnya tidak lagi bergantung pada siapa
# pembukanya.
on:
  pull_request:
    types: [opened, synchronize, reopened]

# Satu PR satu jalur. Kalau PR diubah lagi saat masih diproses, jalannya dibatalkan
# dan diganti dengan yang terbaru.
concurrency:
  group: merge-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      # Validasi diulang di sini, bukan mengandalkan workflow "Validasi klaim".
      # Tanpa hak menulis pada token-nya, workflow itu hanya membaca, jadi centang
      # wajibnya tidak dianggap selesai dan merge lewat API akan ditolak.
      - uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/merge
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Ambil validator versi base
        run: |
          git fetch --no-tags origin "${{ github.event.pull_request.base.ref }}" --depth=1
          git show "origin/${{ github.event.pull_request.base.ref }}:scripts/validate.mjs" > /tmp/validate.mjs
      - name: Validasi
        id: val
        run: |
          git rev-parse HEAD > /tmp/sha
          node /tmp/validate.mjs "origin/${{ github.event.pull_request.base.ref }}" 2>&1 | tee validate.log
        continue-on-error: true

      # Penandaan centang dan merge dikerjakan di satu langkah.
      #
      # Penandaan perlu karena pemeriksaan yang hanya membaca menghasilkan centang
      # milik workflow lain; centang itu tidak memenuhi syarat wajib di branch
      # protection, sehingga merge lewat API ditolak dengan "Required status check
      # validate is expected".
      - name: Tandai lalu merge
        if: steps.val.outcome == 'success'
        env:
          # Token bawaan GitHub, bukan secret. Pull request dari fork tidak
          # menerima secret sama sekali: nilainya kosong, dan gh berhenti dengan
          # "set the GH_TOKEN environment variable" sebelum sempat merge.
          # Token bawaan selalu ada, dan karena job ini berjalan di repo tujuan,
          # hak tulisnya cukup untuk menandai centang sekaligus merge.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NOMOR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha }}
          SHA_GABUNG: ${{ github.event.pull_request.merge_commit_sha || github.event.pull_request.head.sha }}
        run: |
          # Centang "validate" ditulis untuk dua commit: kepala PR dan hasil
          # gabungannya. GitHub menilai syarat wajib pada commit hasil gabungan,
          # bukan pada kepala PR, jadi menandai kepala saja tetap menyisakan syarat
          # yang belum terpenuhi dan merge ditolak dengan "base branch policy
          # prohibits the merge".
          gh api "repos/$REPO/statuses/$SHA" \
            -f state=success -f context=validate \
            -f description="Semua berkas klaim lolos validasi" > /dev/null
          gh api "repos/$REPO/statuses/$SHA_GABUNG" \
            -f state=success -f context=validate \
            -f description="Semua berkas klaim lolos validasi" > /dev/null

          # --admin dipakai karena centang "merge" milik jalur ini sendiri baru
          # selesai setelah merge berhasil, sehingga tanpa hak admin aturannya
          # tidak pernah bisa terpenuhi dan setiap PR menggantung.
          gh pr merge "$NOMOR" --repo "$REPO" --squash --admin
